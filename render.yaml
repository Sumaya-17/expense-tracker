services:
  - type: web
    name: ledgerly-expense-tracker
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app
    envVars:
      - key: FLASK_CONFIG
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ledgerly-db
          property: connectionString
databases:
  - name: ledgerly-db
    plan: free
    databaseName: expense_tracker
    user: expense_tracker
